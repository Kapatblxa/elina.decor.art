<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Сторінку не знайдено — Elina Decor Art</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; background: #f3f3f2; color: #1a1a1e;
    font-family: 'Instrument Sans', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 40px; text-align: center;
  }
  .num {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: clamp(90px, 20vw, 200px); line-height: .9; margin: 0;
  }
  .rule { width: 64px; height: 1px; background: #9a682c; margin: 32px auto; }
  h1 {
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
    font-size: clamp(28px, 4vw, 44px); line-height: 1.1; margin: 0 0 16px;
  }
  p { margin: 0 0 40px; font-size: 17px; line-height: 1.5; color: #4d4942; }
  a {
    display: inline-block; border: 1px solid #1a1a1e; background: #1a1a1e; color: #f3f3f2;
    padding: 16px 28px; font-size: 12px; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; text-decoration: none; transition: background .25s, color .25s;
  }
  a:hover { background: transparent; color: #1a1a1e; }
</style>
</head>
<body>
  <main>
    <p class="num">404</p>
    <div class="rule"></div>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, вона була переміщена або ви перейшли за застарілим посиланням.</p>
    <a href="/">Повернутися на головну</a>
  </main>
</body>
</html>
